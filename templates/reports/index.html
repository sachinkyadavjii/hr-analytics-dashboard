{% extends "base.html" %}
{% block title %}Reports · HR Analytics{% endblock %}
{% block content %}

<h4 class="fw-bold mb-3">Reports</h4>
<div class="row g-3">
  {% for key, label in report_types.items() %}
  <div class="col-md-4">
    <div class="card-flat h-100 d-flex flex-column">
      <div class="d-flex align-items-center gap-2 mb-2">
        <div class="kpi-icon"><i class="bi bi-file-earmark-text"></i></div>
        <div class="fw-semibold">{{ label }}</div>
      </div>
      <div class="text-muted small mb-3 flex-grow-1">Export the latest {{ label|lower }} data for offline analysis or sharing.</div>
      <div class="d-flex gap-2">
        <a href="{{ url_for('reports.export_report', report_type=key, fmt='csv') }}" class="btn btn-sm btn-outline-primary flex-fill"><i class="bi bi-filetype-csv"></i> CSV</a>
        <a href="{{ url_for('reports.export_report', report_type=key, fmt='excel') }}" class="btn btn-sm btn-outline-primary flex-fill"><i class="bi bi-file-earmark-excel"></i> Excel</a>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
